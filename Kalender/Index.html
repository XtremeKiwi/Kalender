<style>
    body{

    h1, h2, h3, h4, h5, h6, p{

    }

        --secondary-gray: #333333;

        --white: #f0f0f0;

        height: 600px;

    }

        margin: auto;
        margin-bottom: 8px;
        height: auto;
        width: auto;
        padding: 1rem;
        background-color: var(--primary-gray);

    }

        align-items: center;
        justify-content: space-around;
        letter-spacing: 2px;
        gap: 2rem;
    }

    .event-time-and-date{
    }

        font-style: italic;
    }

        gap: 1rem;
        align-items: center;

    }

    }

        color: var(--secondary-orange);
    }

        color: var(--primary-gray);
        font-style: italic;

        font-weight: bolder;
        width: 8rem;

    ;

    }
